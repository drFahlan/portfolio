<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#fbfaf8"/>

  <text x="48" y="58" font-size="26" font-weight="700" fill="#1c2129">Doc-Extractor: two ways to fill a table</text>
  <text x="48" y="86" font-size="15" fill="#5b6472">Same output, different source: a document you provide, or the web restricted to trusted health sources.</text>

  <!-- Lane labels -->
  <text x="48" y="150" font-size="13" font-weight="700" letter-spacing="1.2" fill="#2a6f6a">VERSION 1 · YOUR DOCUMENT</text>
  <text x="48" y="366" font-size="13" font-weight="700" letter-spacing="1.2" fill="#9a5a1f">VERSION 2 · TRUSTED WEB SOURCES</text>

  <!-- Lane 1 -->
  <g font-size="15" fill="#1c2129">
    <rect x="48"  y="170" width="188" height="100" rx="6" fill="#e6f0ee" stroke="#2a6f6a"/>
    <text x="142" y="207" text-anchor="middle" font-weight="700">PDF or URL</text>
    <text x="142" y="230" text-anchor="middle" font-size="13" fill="#5b6472">upload or link</text>

    <rect x="290" y="170" width="188" height="100" rx="6" fill="#e6f0ee" stroke="#2a6f6a"/>
    <text x="384" y="207" text-anchor="middle" font-weight="700">Layout-aware text</text>
    <text x="384" y="230" text-anchor="middle" font-size="13" fill="#5b6472">columns and boxes</text>
    <text x="384" y="248" text-anchor="middle" font-size="13" fill="#5b6472">split into blocks</text>

    <rect x="532" y="170" width="188" height="100" rx="6" fill="#e6f0ee" stroke="#2a6f6a"/>
    <text x="626" y="207" text-anchor="middle" font-weight="700">Page retrieval</text>
    <text x="626" y="230" text-anchor="middle" font-size="13" fill="#5b6472">two passes: candidates,</text>
    <text x="626" y="248" text-anchor="middle" font-size="13" fill="#5b6472">then rerank</text>

    <rect x="774" y="170" width="188" height="100" rx="6" fill="#e6f0ee" stroke="#2a6f6a"/>
    <text x="868" y="207" text-anchor="middle" font-weight="700">Batched extraction</text>
    <text x="868" y="230" text-anchor="middle" font-size="13" fill="#5b6472">small model first,</text>
    <text x="868" y="248" text-anchor="middle" font-size="13" fill="#5b6472">escalate if unsure</text>
  </g>
  <g stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M238 220H286"/><path d="M480 220H528"/><path d="M722 220H770"/>
  </g>

  <!-- Lane 2 -->
  <g font-size="15" fill="#1c2129">
    <rect x="48"  y="386" width="188" height="100" rx="6" fill="#f6ece1" stroke="#9a5a1f"/>
    <text x="142" y="423" text-anchor="middle" font-weight="700">Your prompt</text>
    <text x="142" y="446" text-anchor="middle" font-size="13" fill="#5b6472">describe the data</text>

    <rect x="290" y="386" width="188" height="100" rx="6" fill="#f6ece1" stroke="#9a5a1f"/>
    <text x="384" y="423" text-anchor="middle" font-weight="700">Restricted search</text>
    <text x="384" y="446" text-anchor="middle" font-size="13" fill="#5b6472">allowlist only, e.g.</text>
    <text x="384" y="464" text-anchor="middle" font-size="13" fill="#5b6472">Kemenkes, WHO</text>

    <rect x="532" y="386" width="188" height="100" rx="6" fill="#f6ece1" stroke="#9a5a1f"/>
    <text x="626" y="423" text-anchor="middle" font-weight="700">Fetch pages</text>
    <text x="626" y="446" text-anchor="middle" font-size="13" fill="#5b6472">read the sources</text>
    <text x="626" y="464" text-anchor="middle" font-size="13" fill="#5b6472">that were found</text>

    <rect x="774" y="386" width="188" height="100" rx="6" fill="#f6ece1" stroke="#9a5a1f"/>
    <text x="868" y="423" text-anchor="middle" font-weight="700">Extraction</text>
    <text x="868" y="446" text-anchor="middle" font-size="13" fill="#5b6472">rows with the</text>
    <text x="868" y="464" text-anchor="middle" font-size="13" fill="#5b6472">source they came from</text>
  </g>
  <g stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M238 436H286"/><path d="M480 436H528"/><path d="M722 436H770"/>
  </g>

  <!-- Merge into output -->
  <g stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M964 220H1050Q1064 220 1064 234V320"/>
    <path d="M964 436H1050Q1064 436 1064 422V366"/>
  </g>

  <rect x="984" y="326" width="160" height="34" rx="6" fill="#1c2129"/>
  <text x="1064" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#fbfaf8">Live table</text>
</svg>
